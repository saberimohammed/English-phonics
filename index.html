<meta name="description" content="تعلّم نطق الإنجليزية خطوة بخطوة: أصوات الحروف، دمج الكلمات، قراءة الجمل مع تصحيح النطق." />
<title>التفاحة | تعلّم نطق الإنجليزية — قناة التفاحة التعليمية</title>
<style>
  :root {
    --bg: #050811;
    --card: #0d1426;
    --card2: #131d36;
    --border: rgba(56, 189, 248, 0.28);
    --cyan: #38bdf8;
    --purple: #a855f7;
    --pink: #ec4899;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body {
    background: radial-gradient(circle at 50% 0%, #132046 0%, #050811 68%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 52px;
  }
  .container { max-width: 1050px; margin: 0 auto; padding: 14px; }
  .neon-card {
    background: linear-gradient(145deg, rgba(13, 20, 38, 0.97), rgba(19, 29, 54, 0.95));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), inset 0 0 24px rgba(56, 189, 248, 0.06);
  }
  .btn {
    border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700;
    cursor: pointer; transition: all 0.18s ease; display: inline-flex;
    align-items: center; justify-content: center; gap: 7px; font-size: 14px;
    color: #fff; text-decoration: none; user-select: none;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #0284c7, #6366f1); box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35); }
  .btn-purple { background: linear-gradient(135deg, #7c3aed, #c026d3); box-shadow: 0 4px 16px rgba(168, 85, 247, 0.35); }
  .btn-green { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3); }
  .btn-amber { background: linear-gradient(135deg, #d97706, #f59e0b); color: #090d16; box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35); }
  .btn-slow { background: linear-gradient(135deg, #0d9488, #14b8a6); color: #041311; box-shadow: 0 4px 14px rgba(20, 184, 166, 0.32); }
  .btn-pink { background: linear-gradient(135deg, #db2777, #9333ea); box-shadow: 0 4px 16px rgba(236, 72, 153, 0.3); }
  .btn-red { background: linear-gradient(135deg, #dc2626, #991b1b); }
  .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: rgba(56, 189, 248, 0.14); border-color: var(--cyan); }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }

  .input-field {
    width: 100%; padding: 13px 15px; border-radius: 12px;
    border: 1px solid rgba(56, 189, 248, 0.35); background: rgba(5, 8, 17, 0.85);
    color: #fff; font-size: 15px; outline: none; transition: 0.2s;
  }
  .input-field:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

  /* Login Screen */
  #loginScreen { min-height: 92vh; display: flex; align-items: center; justify-content: center; }
  .login-box { width: 100%; max-width: 560px; text-align: center; }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.45);
    color: var(--cyan); font-size: 13px; font-weight: 700; margin-bottom: 10px;
  }
  .title-glow {
    font-size: 28px; font-weight: 900; margin-bottom: 8px;
    background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .levels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 18px; }
  .level-opt {
    background: rgba(255,255,255,0.03); border: 2px solid rgba(148, 163, 184, 0.22);
    border-radius: 15px; padding: 12px 8px; cursor: pointer; transition: 0.2s;
  }
  .level-opt.active {
    border-color: var(--cyan); background: rgba(56, 189, 248, 0.16);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.28);
  }
  .level-opt h4 { font-size: 14px; margin: 4px 0; color: #fff; }
  .level-opt p { font-size: 11px; color: var(--muted); line-height: 1.4; }

  /* App Header */
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px; padding: 14px 18px;
  }
  .student-pill { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a855f7);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px;
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
  }
  .stats-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .stat-chip {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
  }

  /* Navigation Tabs */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  @media (max-width: 760px) { .tabs { grid-template-columns: repeat(2, 1fr); } .levels-grid { grid-template-columns: 1fr; } }
  .tab-btn {
    background: rgba(13, 20, 38, 0.92); border: 1px solid var(--border);
    color: var(--muted); padding: 11px 8px; border-radius: 14px;
    font-weight: 700; cursor: pointer; font-size: 12.5px; transition: 0.2s;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(2,132,199,0.38), rgba(124,58,237,0.38));
    border-color: var(--cyan); color: #fff; box-shadow: 0 0 16px rgba(56, 189, 248, 0.22);
  }

  /* Phonics Grid */
  .letters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 9px; margin-top: 14px; }
  .letter-tile {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 14px; padding: 10px 6px; text-align: center; cursor: pointer; transition: 0.2s;
  }
  .letter-tile:hover, .letter-tile.selected {
    background: rgba(56, 189, 248, 0.2); border-color: var(--cyan); transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.2);
  }
  .letter-tile .big { font-size: 23px; font-weight: 900; color: var(--cyan); direction: ltr; }
  .letter-tile .ar-snd { font-size: 11.5px; color: #e2e8f0; margin-top: 3px; }

  /* Blend & Word Tiles */
  .blend-letters { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 18px 0; direction: ltr; }
  .sound-chip {
    min-width: 72px; padding: 16px 16px; border-radius: 16px; font-size: 30px; font-weight: 900;
    background: rgba(168, 85, 247, 0.16); border: 2px solid rgba(168, 85, 247, 0.55);
    color: #fff; cursor: pointer; transition: 0.2s;
  }
  .sound-chip:hover { transform: scale(1.07); border-color: var(--cyan); }
  .sound-chip.lit { background: var(--cyan); color: #050811; box-shadow: 0 0 24px var(--cyan); }

  /* Sentence Reader & Karaoke Synchronized Word Pointer */
  .sentence-box {
    background: rgba(5, 8, 17, 0.78); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; margin: 14px 0; text-align: center;
  }
  .words-line {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; direction: ltr; margin-bottom: 12px;
  }
  .words-line-left {
    display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; direction: ltr; margin: 6px 0;
  }
  .word-span {
    position: relative;
    font-size: 24px; font-weight: 800; padding: 6px 11px; border-radius: 10px;
    background: rgba(255,255,255,0.05); cursor: pointer; transition: all 0.12s ease;
    border: 1px solid transparent;
  }
  .word-span-sm {
    position: relative;
    font-size: 17px; font-weight: 800; padding: 4px 8px; border-radius: 8px;
    background: rgba(255,255,255,0.05); cursor: pointer; transition: all 0.12s ease;
    border: 1px solid transparent; color: #fff;
  }
  .word-span:hover, .word-span-sm:hover {
    background: rgba(56, 189, 248, 0.22); border-color: rgba(56, 189, 248, 0.5);
  }
  /* المؤشر الحي المتزامن مع الصوت كلمة بكلمة */
  .word-span.speaking, .word-span-sm.speaking {
    background: linear-gradient(135deg, #f59e0b, #fbbf24) !important;
    color: #050811 !important;
    transform: translateY(-3px) scale(1.09);
    box-shadow: 0 0 18px rgba(245, 158, 11, 0.85), 0 4px 10px rgba(0,0,0,0.4);
    border-color: #fff !important;
    z-index: 2;
  }
  .word-span.speaking::before, .word-span-sm.speaking::before {
    content: "▼";
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #38bdf8;
    text-shadow: 0 0 8px #38bdf8;
  }
  .word-span.ok { background: rgba(16, 185, 129, 0.25); border: 1px solid var(--green); color: #6ee7b7; }
  .word-span.bad { background: rgba(239, 68, 68, 0.25); border: 1px solid var(--red); color: #fca5a5; }

  #waveCanvas {
    width: 100%; height: 64px; background: rgba(0,0,0,0.45); border-radius: 12px;
    border: 1px solid rgba(56, 189, 248, 0.25); margin-top: 12px; display: none;
  }

  /* AI Expansion Drawer inside every stage */
  .ai-expand-panel {
    margin-top: 16px;
    background: linear-gradient(145deg, rgba(245, 158, 11, 0.08), rgba(56, 189, 248, 0.08));
    border: 1px solid rgba(245, 158, 11, 0.45);
    border-radius: 18px;
    padding: 16px;
    text-align: right;
    animation: fadeSlide 0.25s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* AI Cards & Word X-Ray */
  .ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 10px; margin-top: 10px; }
  .ai-subcard {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 14px; padding: 12px; text-align: right;
  }
  .xray-box {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; direction: ltr;
    margin: 14px 0; padding: 14px; background: rgba(0,0,0,0.35); border-radius: 14px;
  }
  .xray-syl {
    padding: 10px 16px; border-radius: 12px; font-size: 26px; font-weight: 900;
    border: 2px solid var(--cyan); background: rgba(56, 189, 248, 0.12); cursor: pointer;
  }
  .xray-vowel { color: #f472b6; text-decoration: underline; }
  .xray-silent { color: #64748b; opacity: 0.55; border-bottom: 2px dashed #ef4444; }

  /* Chat Roleplay */
  .chat-feed {
    max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    padding: 12px; background: rgba(0,0,0,0.35); border-radius: 14px; margin: 12px 0;
  }
  .chat-msg { padding: 10px 14px; border-radius: 14px; max-width: 88%; font-size: 14px; line-height: 1.6; }
  .chat-ai { align-self: flex-start; background: rgba(56, 189, 248, 0.16); border: 1px solid rgba(56, 189, 248, 0.35); }
  .chat-user { align-self: flex-end; background: rgba(168, 85, 247, 0.22); border: 1px solid rgba(168, 85, 247, 0.4); }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.84); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px;
  }
  .modal-box { width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
  .hidden { display: none !important; }
  .banner-tg {
    background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    font-size: 13px;
  }
  .warn-viewer {
    background: rgba(245, 158, 11, 0.18); border: 1px solid var(--amber);
    border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: 13px; color: #fde68a; line-height: 1.6;
  }
  .stage-header-flex {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; margin-top
